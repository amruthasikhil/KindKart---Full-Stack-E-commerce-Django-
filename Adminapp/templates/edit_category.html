<!DOCTYPE html>
{% extends "index.html" %}
{% block content %}
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kindkart </title>
        <!-- plugins:css -->
        
      </head>
<body>
    <div class="card-body">

      <form action="{% url 'updatecategory' catid=data.id %}" method="post">
        {% csrf_token %}

   
        <h4 class="card-title">Add Category</h4>
        
        <div class="form-group">
          <label>Enter Category</label>
          <input type="text" name="category" value="{{data.name}}" class="form-control form-control-lg" placeholder="Category" aria-label="Username">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description"  class="form-control form-control-lg" id="">{{data.description}}</textarea>
           
          </div>

          
          <div class="form-group">
            <label>Choose Condition</label>
            <select class="form-control" name="status" >
<option selected>{{data.availability}}</option>
                <option>Available</option>
                <option>Not Available</option>
               
              </select>
          </div>


        <div class="form-group">
            <input type="submit" class="text-white btn btn-primary form-control-lg" placeholder="Username" aria-label="Username">
          </div>
        </form>
        
      </div>
      
</body>
</html>
{% endblock %}
