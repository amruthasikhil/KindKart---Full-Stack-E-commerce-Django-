<!DOCTYPE html>
{% extends "index.html" %}
{% block content %}
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kindkart </title>
        <!-- plugins:css -->
        
      </head>
<body>
    <div class="card-body">
        <h4 class="card-title">Sub Categories Table</h4>
        <hr>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr style="background-color: rgb(248, 244, 244);">
                <th>Sl no</th>
                <th>Category</th>
                <th>SubCategory</th>
                <th>Description</th>
                <th>Availability</th>
                <th colspan="2">Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for i in data %}
              <tr>

                <td>{{forloop.counter}}</td>
                <td>{{i.categories}}</td>
                <td>{{i.name}}</td>
                <td>{{i.description}}</td>
                <td > 
                  <label class="badge badge-success">{{i.availability }}</label></td>
                   </i></td>
                <td>
                  <a href="{% url 'editsubcategory' subid=i.id %}" class="btn btn-warning text-dark">Edit</a>
             
                  <a href="{% url 'deletesubcategory' subid=i.id %}" class="btn btn-danger text-white">Delete</a>
                </td>
              </tr>
             {% endfor %}
            
            
            </tbody>
          </table>
        </div>
      </div>
</body>
</html>
{% endblock %}
