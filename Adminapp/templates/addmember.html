<!DOCTYPE html>
{% extends "index.html" %}
{% block content %}
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kindkart </title>
        <!-- plugins:css -->
        
      </head>
<body>

<form action="{% url 'addmember_post' %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}

    <div class="card-body">
        <h4 class="card-title">Add Member</h4>
        

       
     

        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
        </div>


          <div class="form-group">
            <label> Image</label>
            <input type="file" name="imgg" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
          </div>

          <div class="form-group">
            <label>Designation</label>
            <input type="text" name="duty" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
          </div>

          <div class="form-group">
            <input type="submit" class="text-white btn btn-primary form-control-lg" placeholder="Username" aria-label="Username">
          </div>
          
      </div>
    </form>
</body>
</html>
{% endblock %}
