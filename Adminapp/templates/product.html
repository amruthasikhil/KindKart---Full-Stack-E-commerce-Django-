<!DOCTYPE html>
{% extends "index.html" %}
{% block content %}
<html lang="en">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kindkart </title>
        <!-- plugins:css -->
        
      </head>
<body>

<form action="{% url 'addroductspost' %}" method="post" enctype="multipart/form-data">
  {% csrf_token %}

    <div class="card-body">
        <h4 class="card-title">Add Product</h4>
        

        <div class="form-group">
            <label>Choose Category</label>
            <select class="form-control form-control-lg" name="category">
              {% for i in data %}
                <option>{{i.name}}</option>
                {% endfor %}
              </select>
          </div>
     

        <div class="form-group">
          <label>Product name</label>
          <input type="text" name="product" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control form-control-lg" id=""></textarea>
           
          </div>

       

          <div class="form-group">
            <label>Choose Condition</label>
            <select class="form-control" name="level" >
                <option>Good</option>
                <option>Average</option>
                <option>Perfect</option>
                <option>Bad</option>
              </select>
          </div>

        

          <div class="form-group">
            <label>Product Image</label>
            <input type="file" name="imgg" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
          </div>

          <div class="form-group">
            <label>Price</label>
            <input type="text" name="price" class="form-control form-control-lg" placeholder="Username" aria-label="Username">
          </div>

          <div class="form-group">
            <input type="submit" class="text-white btn btn-primary form-control-lg" placeholder="Username" aria-label="Username">
          </div>
          
      </div>
    </form>
</body>
</html>
{% endblock %}
