

   
   
      
      <!DOCTYPE html>

      {% load static %}
      <html lang="en">
      
      <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <title>Kindkart </title>
        <!-- plugins:css -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  <link rel="stylesheet" href="{% static 'admin/vendors/feather/feather.css' %}">
        <link rel="stylesheet" href="{% static 'admin/vendors/mdi/css/materialdesignicons.min.css' %}">
        <link rel="stylesheet" href="{% static 'admin/vendors/ti-icons/css/themify-icons.css' %}">
        <link rel="stylesheet" href="{% static 'admin/vendors/typicons/typicons.css' %}">
        <link rel="stylesheet" href="{% static 'admin/vendors/simple-line-icons/css/simple-line-icons.css' %}">
        <link rel="stylesheet" href="{% static 'admin/vendors/css/vendor.bundle.base.css' %}">
        <!-- endinject -->
        <!-- Plugin css for this page -->
        <link rel="stylesheet" href="{% static 'admin/js/select.dataTables.min.css' %}">
        <!-- End plugin css for this page -->
        <!-- inject:css -->
        <link rel="stylesheet" href="{% static 'admin/css/vertical-layout-light/style.css' %}">
        <!-- endinject -->
        <link rel="shortcut icon" href="{% static 'admin/images/favicon.png' %}" />
      </head>
      
      <body>
        <div class="container-scroller">
          <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth px-0">
              <div class="row w-100 mx-0">
                <div class="col-lg-4 mx-auto">
                   
                  <div class="auth-form-light text-left py-5 px-4 px-sm-5">
                    <div class="">
                      <img src="{% static 'user/images/bglogo.png' %}" width="150px" alt="">
                    </div>
                    <h4 class="mt-3">Hello! let's get started</h4>
                    <h6 class="fw-light">Sign in to continue.</h6>

                    <p>Don't Have an account ..?
                        <a href="{% url 'userregister' %}">Sign Up Now</a>
                    </p>
                    <form class="pt-3" action="{% url 'usersignpost' %}" method="post">
                      {% csrf_token %}
                      <div class="form-group">
                        <input type="text" name="email" class="form-control form-control-lg" id="exampleInputEmail1"
                          placeholder="Username">
                      </div>
                      <div class="form-group">
                        <input type="password"  name="password" class="form-control form-control-lg" id="exampleInputPassword1"
                          placeholder="Password">
                      </div>
                      <div class="mt-3">
                        <input type="submit" class="btn btn-primary" value="SIGN IN">
                      </div>
                      <div class="my-2 d-flex justify-content-between align-items-center">
                        <div class="form-check">
                            <a href="{% url 'landingpage' %}" class="auth-link text-black">Back to Home</a>

                        </div>
                        <a href="#" class="auth-link text-black">Forgot password?</a>
                      </div>
                    
                    
                    </form>
                  </div>
                </div>
              </div>
            </div>
            <!-- content-wrapper ends -->
          </div>
          <!-- page-body-wrapper ends -->
        </div>
        <!-- container-scroller -->
        <!-- plugins:js -->
        <script src="../../assets/vendors/js/vendor.bundle.base.js"></script>
        <script src="../../assets/vendors/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
        <!-- endinject -->
        <!-- Plugin js for this page -->
        <script src="../../assets/vendors/bootstrap-datepicker/bootstrap-datepicker.min.js"></script>
        <!-- End plugin js for this page -->
        <!-- inject:js -->
        <script src="../../assets/js/off-canvas.js"></script>
        <script src="../../assets/js/hoverable-collapse.js"></script>
        <script src="../../assets/js/template.js"></script>
        <script src="../../assets/js/settings.js"></script>
        <script src="../../assets/js/todolist.js"></script>
        <!-- endinject -->
      </body>
      
      </html>
