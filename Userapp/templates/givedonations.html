<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>

  <!-- SITE TITTLE -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calssimax</title>
  
  <!-- PLUGINS CSS STYLE -->
  <!-- PLUGINS CSS STYLE -->
  <link href="{% static 'user/plugins/jquery-ui/jquery-ui.min.css' %}" rel="stylesheet">
  <!-- Bootstrap -->
  <link href="{% static 'user/plugins/bootstrap/dist/css/bootstrap.min.css' %}" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="{% static 'user/plugins/font-awesome/css/font-awesome.min.css' %}" rel="stylesheet">
  <!-- Owl Carousel -->
  <link href="{% static 'user/plugins/slick-carousel/slick/slick.css' %}" rel="stylesheet">
  <link href="{% static 'user/plugins/slick-carousel/slick/slick-theme.css' %}" rel="stylesheet">
  <!-- Fancy Box -->
  <link href="{% static 'user/plugins/fancybox/jquery.fancybox.pack.css' %}" rel="stylesheet">
  <link href="{% static 'user/plugins/jquery-nice-select/css/nice-select.css' %}" rel="stylesheet">
  <link href="{% static 'user/plugins/seiyria-bootstrap-slider/dist/css/bootstrap-slider.min.css' %}" rel="stylesheet">
  <!-- CUSTOM CSS -->
  <link href="{% static 'user/css/style.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- FAVICON -->
  <link href="{% static 'user/img/favicon.png' %}" rel="shortcut icon">

  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->

</head>

<section class="signup">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-7">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 rounded-3" style="box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;">
                        <div class="d-flex mb-3 justify-content-between align-items-center">
                            <h2 class="card-title text-primary fw-bold">Add Product</h2>

                            {%  if request.session.lid %}
                            <a href="{%  url 'userhome' %}" style="font-size: 2.2rem;"><i class="bi bi-x"></i></a>
                            {% else %}
                            <a href="{%  url 'landingpage' %}" style="font-size: 2.2rem;"><i class="bi bi-x"></i></a>
                            {% endif %}
                        </div>
                        

                        <h4>Upload, describe, and set a price—your next buyer is waiting!</h4>
                        <p class="text-start text-muted">Fill in the details below to list your product. Make sure to add a clear image and accurate description!</p>
                        <form action="{% url 'adddonationpost' %}" method="post" enctype="multipart/form-data">
                            {% csrf_token %}

                            <div class="form-group mb-3">
                                <label class="fw-semibold"><b>Choose Category</b>  </label>
                                <select class="form-control rounded-3" name="category" style="max-width: 100%;">
                                    {% for i in data %}
                                        <option>{{ i.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label class="fw-semibold"><b> Product Name</b></label>
                                <input type="text" name="product" class="form-control rounded-3" 
                                    placeholder="Enter product name" style="max-width: 100%;">
                            </div>

                            <div class="form-group mb-3">
                                <label class="fw-semibold"><b>Description</b></label>
                                <textarea name="description" class="form-control rounded-3" rows="3" 
                                    placeholder="Write product details..." style="max-width: 100%;"></textarea>
                            </div>

                            <div class="form-group mb-3">
                                <label class="fw-semibold"><b>Choose Condition</b> </label>
                                <select class="form-control rounded-3" name="level" style="max-width: 100%;">
                                    <option>Good</option>
                                    <option>Average</option>
                                    <option>Perfect</option>
                                    <option>Bad</option>
                                </select>
                            </div>

                            <div class="form-group mb-3">
                                <label class="fw-semibold"><b>Product Image</b> </label>
                                <input type="file" name="imgg" class="form-control rounded-3"
                                    style="max-width: 100%; overflow: hidden;">
                            </div>

                            <div class="form-group mb-4">
                                <label class="fw-semibold"><b>Price</b></label>
                                <input type="text" name="price" class="form-control rounded-3" 
                                    placeholder="Enter price" style="max-width: 100%;">
                            </div>

                            <div class="form-group text-center">
                                <input type="submit" class="btn btn-primary px-4 py-2" style="min-width: 150px; max-width: 100%;" value="Add Product">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>





</html>
