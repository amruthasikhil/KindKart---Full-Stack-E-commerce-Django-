<!DOCTYPE html>

{% load static %}
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Kindkart </title>
  <!-- plugins:css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">  <link rel="stylesheet" href="{% static 'admin/vendors/feather/feather.css' %}">
  <link rel="stylesheet" href="{% static 'admin/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'admin/vendors/ti-icons/css/themify-icons.css' %}">
  <link rel="stylesheet" href="{% static 'admin/vendors/typicons/typicons.css' %}">
  <link rel="stylesheet" href="{% static 'admin/vendors/simple-line-icons/css/simple-line-icons.css' %}">
  <link rel="stylesheet" href="{% static 'admin/vendors/css/vendor.bundle.base.css' %}">
  <!-- endinject -->
  <!-- Plugin css for this page -->
  <link rel="stylesheet" href="{% static 'admin/js/select.dataTables.min.css' %}">
  <!-- End plugin css for this page -->
  <!-- inject:css -->
  <link rel="stylesheet" href="{% static 'admin/css/vertical-layout-light/style.css' %}">
  <!-- endinject -->
  <link rel="shortcut icon" href="{% static 'admin/images/favicon.png' %}" />
</head>
<body>


           
                    <div class="container-scroller">
                        <div class="container-fluid page-body-wrapper full-page-wrapper">
                          <div class="content-wrapper d-flex align-items-center auth px-0">
                            <div class="row w-100 mx-0">
                              <div class="col-lg-6 mx-auto">
                                <div class="auth-form-light text-left py-5 px-4 px-sm-5">
                                  <div class="text-start">
                                    <img src="{% static 'user/images/bglogo.png' %}" width="150px" alt="">
                                  </div>
                                  <h4 class="mt-3">Create an Account</h4>
                                  <h6 class="fw-light">Sign up to get started.</h6>
                      
                                  <p>Already have an account? 
                                    <a href="{% url 'usersign' %}">Sign in</a>
                                  </p>
                      
                                  <form class="pt-3" action="{% url 'userregisterpost' %}" method="post" enctype="multipart/form-data">
                                    {% csrf_token %}
                                    
                                    <div class="form-group">
                                      <input type="text" name="name" class="form-control form-control-lg" placeholder="Enter your Name" required>
                                    </div>
                      
                                    <div class="form-group">
                                      <input type="text" name="mob" class="form-control form-control-lg" placeholder="Enter Mobile number" required>
                                    </div>
                      
                                    <div class="form-group">
                                      <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required>
                                    </div>
                      
                                    <div class="form-group">
                                      <input type="file" name="imgg" class="form-control form-control-lg" required>
                                    </div>
                      
                                    <div class="form-group">
                                      <input type="password" name="pwd" class="form-control form-control-lg" placeholder="Password" required>
                                    </div>
                      
                                    <div class="form-group">
                                      <input type="checkbox" class="form-check-input" name="terms" checked>
                                      <label class="form-check-label">I agree to the terms and conditions</label>
                                    </div>
                      
                                    <div class="mt-3">
                                      <input type="submit" class="btn btn-primary" value="SIGN UP">
                                    </div>
                      
                                    <div class="my-2">
                                      <a href="{% url 'landingpage' %}" class="auth-link text-black">Back to Home</a>
                                    </div>
                                  
                                  </form>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      
                </div>
            </div>
        </div>
    </section>
        </div>
   <!-- Registration 5 - Bootstrap Brain Component -->

</body>
</html>
